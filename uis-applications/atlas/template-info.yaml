# Where the install definition actually lives.
#
# The digest is authored and committed, never resolved at build time: a tag is
# mutable at a registry, so a build that re-resolved it would let a re-pointed tag
# be blessed by the next unrelated docs build. Bumping atlas is a reviewed change
# to `digest` here.
#
# Verified before pinning by `scripts/verify-application-pin.sh` (urb-agents #1374):
#   asset artifact_digest and GHCR docker-content-digest agree; image_digest
#   (sha256:9d3588a9…) distinguished and asserted NOT to be this value
#   blob hashes to the manifest; kind/id/tag self-consistent
#
# ⚠️ THE DATE PREFIX ROLLED: v20260922-, not v20260921-. Five pins in a row carried the
# earlier date and pattern-matching the prefix would have looked right and resolved wrong.
#
# ✅ LANDED. The min/max scope fix: min_value and max_value were computed over every kommune
# the fact table holds while the counts beside them were scoped to active non-sentinel
# kommuner, so 33 of 222 series published a range over kommuner the relation does not serve.
# 33 -> 0, measured from outside by paging all 79254 fact rows and folding per series, and
# independently on the host. transform 5d6cb18c SUCCESS 337.9s, run pod ff164d5, checks
# 990/18/1008 with NEW none and GONE none.
#
# 🔵 The restraint is the part worth keeping: ssb-06913 Levende still has min = 0.
# Excluding zeros along with sentinels would have made a tidier table, passed a casual read,
# and silently deleted the fact that a kommune had no live births. And ssb-12063 keeps its
# row with NULL min/max and count 0 — present and empty, not dropped.
#
# 🔴 THE HAND-CARRIED KLASS SEQUENCE STAYS, and this pin is why. operational.upgrade
# exists at 6cb28f4, which is BUILT AND NOT DEPLOYED; ff164d5 is what ran and is two commits
# behind it, so the pinned artifact still has no upgrade field (verified by parsing it). "The
# field exists in the artifact" and "the pinned artifact has the field" are different claims
# and this repo was handed the first (#1373) before being told the difference (#1374).
#
# ⚠️ NO GATE CAUGHT ANY OF IT. Three scope defects in two days — counts vs the range,
# the null filter vs its subject, latest_year vs the counts — all found from outside by
# consumers, with the suite reporting 990/18 before and after each. A gate for the class is
# being written upstream. Recorded on the page beside "the check is never proactive".
#
# ⚠️ UNCHANGED, and not this release's doing: ssb-12063 is still the only series at
# kommuner_with_value = 0; #394's stated effect is still not observable (3648 rows, the six
# two-digit pseudo-fylker); 9999 "Uoppgitt" is still an active kommune making an "active
# kommuner" denominator 358 against Norway's 357. All already on the page as caveats.
#
# ⚠️ A PIN DOES NOT LAND THE DATA. Pin and run are two actions and this catalogue
# performs only the first.
#
# Procedural lessons from the previous bump (tags/list truncation, and a stale working
# tree nearly reverting PR #86) now live in RUNBOOK-application-pin-bump.md, under
# "Two ways this check has been wrong" — not here, because this block is rewritten
# every bump and a lesson stored in it is a lesson scheduled for deletion.
