# Where the install definition actually lives.
#
# The digest is authored and committed, never resolved at build time: a tag is
# mutable at a registry, so a build that re-resolved it would let a re-pointed tag
# be blessed by the next unrelated docs build. Bumping atlas is a reviewed change
# to `digest` here.
#
# Verified before pinning by `scripts/verify-application-pin.sh` (urb-agents #1363):
#   asset artifact_digest and GHCR docker-content-digest agree; image_digest
#   (sha256:c3e6f473…) distinguished and asserted NOT to be this value
#   blob hashes to the manifest; kind/id/tag self-consistent
#
# THE VERIFIER ITSELF WAS FIXED BEFORE THIS PIN WAS MEASURED. ops-dev's probe of this
# tag returned ABSENT because its Accept list omitted the OCI manifest type, and it
# nearly reported the artifact as never built — the tag was in tags/list the whole time
# (#1363). This script sent the same two common types. It now sends the full list
# INCLUDING index types, and when no digest comes back it asks tags/list and says which
# of the two it found, instead of printing "does the tag exist?" at both. Tested against
# a genuinely absent tag and against this one.
#
# THE PROSE WAS RE-DERIVED. data.discover CHANGED — it now names served_as and
# meta_dimensions, so the page's endpoint list is the artifact's own and the
# hand-carried warning about served_as is retired on its condition being met.
# operational.install.first_load CHANGED.
#
# ✅ THE THREE-WAY CONTRADICTION IN install.first_load IS FIXED AT THE CAUSE. It now
# reads models=63 plus seeds=18 (= 81, agreeing with its own headline), views=10 named
# once, and the "(61 / 5 / 66 / 52)" exact-match claim retired with its reason. Every
# figure is generated by uis/generate-holdings.py.
#   🔴 That fix also says this repo's page was crediting the WRONG SCRIPT
#   (render-template-info.sh), a name quoted faithfully from the field it described. A
#   quotation inherits its source's errors, and no check here could have caught it.
#
# ⚠️ PARTIAL, and pinned as one. 18 of 26 dead series recovered (crime-tables were
# never empty — reported at a year the legacy LovbruddKrim vocabulary had stopped
# covering). Still open: ssb-06913's seven series, now with a PRECISE cause — latest_year
# is computed without restricting to the kommuner the relation serves, and SSB zero-fills
# municipalities dissolved in 1957-59, so Hopen (1915-1959) reporting 0 deaths in 2026
# holds the whole source at 2026. And ssb-12063, a SECOND separate gap: SSB holds 1812
# values across 2015-2018 that never reached the fact table. #1351, #1363.
#
# ⚠️ A PIN DOES NOT LAND THE DATA. Deployed image read off the RUN POD, transform at
# 21:17:06Z, 989/1008 checks succeeded with the 19 pre-existing FK warns unchanged in
# both directions. Pin and run are two actions and this catalogue performs only the first.
#
# Procedural lessons from the previous bump (tags/list truncation, and a stale working
# tree nearly reverting PR #86) now live in RUNBOOK-application-pin-bump.md, under
# "Two ways this check has been wrong" — not here, because this block is rewritten
# every bump and a lesson stored in it is a lesson scheduled for deletion.
