# Where the install definition actually lives.
#
# The digest is authored and committed, never resolved at build time: a tag is
# mutable at a registry, so a build that re-resolved it would let a re-pointed tag
# be blessed by the next unrelated docs build. Bumping atlas is a reviewed change
# to `digest` here.
#
# Verified before pinning by `scripts/verify-application-pin.sh` (urb-agents #1341):
#   asset artifact_digest and GHCR docker-content-digest agree; image_digest
#   (sha256:f0cd2d0a…) distinguished and asserted NOT to be this value
#   blob hashes to the manifest; kind/id/tag self-consistent
#   --drift independently agreed the catalogue was behind at 2d88589
#
# This bump is a PURE PIN MOVE for this page. The artifact's `data:` and `operational:`
# blocks were diffed against v20260921-2d88589 and are UNCHANGED — all five data:
# subsections equal, operational: identical. So no prose was re-derived, and the absence
# of page changes here is a measured result rather than an omission.
#
# What the release itself carries (atlas's account, not verified here): window-year
# descriptions, a `window_years` column, an ssb_08764 UNION arity fix, a verifier
# User-Agent fix, and a new root document.
#
# ⚠️ A PIN DOES NOT LAND THE DATA. atlas reports the data behind these descriptions is
# already live; this entry catching up to it is a separate fact from the rows existing.
# Pin and run are two actions and this catalogue performs only the first.
#
# Procedural lessons from the previous bump (tags/list truncation, and a stale working
# tree nearly reverting PR #86) now live in RUNBOOK-application-pin-bump.md, under
# "Two ways this check has been wrong" — not here, because this block is rewritten
# every bump and a lesson stored in it is a lesson scheduled for deletion.
source:
  artifact: ghcr.io/terchris/atlas-data/uis
  tag: v20260921-fcf78e6
  digest: "sha256:d68d04c607feec7abc5cc64e46b03241aeb3e6cf81b60206152387df8079065f"

# Top-level, NOT inside source: that is where UIS reads it from.
visibility: public

configure_command: "uis template install atlas"

