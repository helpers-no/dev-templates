# Where the install definition actually lives.
#
# The digest is authored and committed, never resolved at build time: a tag is
# mutable at a registry, so a build that re-resolved it would let a re-pointed tag
# be blessed by the next unrelated docs build. Bumping atlas is a reviewed change
# to `digest` here.
#
# Verified before pinning by `scripts/verify-application-pin.sh` (urb-agents #1007).
#
# ⚠️ THIS PIN'S DIGESTS WERE NOT CONFIRMED BY imac — the nominator said so plainly and
# relied on this repository's read as the independent one, because imac had two jobs that
# outranked a docs pin. So the read was done with BOTH controls in the same session:
#   v20260914-b7e513f   HTTP 200   asset artifact_digest == GHCR docker-content-digest
#   v20260914-15dc497   HTTP 200   good control
#   nosuchtag-control   HTTP 404   bad control — the instrument discriminates
# image_digest (sha256:e78eedf1…) distinguished and asserted NOT to be this value.
#
# Documentation only. Key list from the PULLED artifact: the eight code_location keys are
# identical to 15dc497's, env_from_services unchanged, env_from_exports absent. No models,
# no migrations, no schema keys. UIS floor unchanged at 1.6.84+. --full-refresh from
# 72999a4 unchanged.
#
# 🔴 WHAT IT CORRECTS, and this repository was repeating the error: the previous artifact
# said "Enabling them starts the NEXT scheduled run". True of the two schedules, WRONG for
# the automation sensor that drives all ~40 ingest sources — on_cron means "tick passed
# AND deps updated since that tick", both trivially true on a fresh install, so it can
# begin fetching within about a minute. Enabling at 16:55 on a Friday starts work at
# 16:55.
#
# That sentence was in this entry's abstract and on the catalogue page, because this repo
# mirrored it from the artifact on #764. Both corrected here.
#
# UIS 1.6.90 shipped `uis dagster automation --start` an hour before this nomination, so
# enabling went from opening a web UI to one command — which is why a wrong timing
# sentence stopped being academic.
#
# ⚠️ ORDERING, new on the page: launch the first-data jobs BEFORE enabling automation.
# Enable first and the sensor decides the order — brreg_change_feed starts, finds no
# watermark and fails loudly until brreg_bootstrap has run. By design, not a fault, and
# avoidable.
