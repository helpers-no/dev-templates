# Where the install definition actually lives.
#
# The digest is authored and committed, never resolved at build time: a tag is
# mutable at a registry, so a build that re-resolved it would let a re-pointed tag
# be blessed by the next unrelated docs build. Bumping atlas is a reviewed change
# to `digest` here.
#
# Verified before pinning by `scripts/verify-application-pin.sh` (urb-agents #1368):
#   asset artifact_digest and GHCR docker-content-digest agree; image_digest
#   (sha256:dba56560…) distinguished and asserted NOT to be this value
#   blob hashes to the manifest; kind/id/tag self-consistent
#
# ✅ LANDED, not PARTIAL — the first tonight the word applies to. ssb-06913's eight
# series all report 357 of 357 (seven at 2025, Folkemengde at 2026) and
# indicator_missing_kommuner for the source went 2499 -> 0: those values were in the
# fact table all along. Spot cells predicted from SSB BEFORE the run matched to the
# digit, and acceptance was measured twice against two dim_kommune versions (1158 and
# 1170 codes) with identical results. One FK check cleared, none new, reproduced by an
# independent sensor run.
#
# 🔴 TAKING THIS PIN IS THREE STEPS AND THE MIDDLE ONE IS NOT OPTIONAL:
#     install a657f4f -> uis dagster run klass_refresh -> uis dagster run transform_and_publish
#   transform_and_publish rebuilds mart_dim_kommune from raw.ssb_klass_kommuner but never
#   RE-FETCHES it, so deploy-then-transform rebuilds the same stale rows and 3e72760 (the
#   Klass window widened 1960 -> 1950) is inert with every signal green. The twelve orphan
#   codes all dissolved on or before 1960 — the ingest was not failing, it was not looking
#   far enough back.
#
# 🟠 AND THAT SEQUENCE IS NOT IN THE ARTIFACT. data: and operational: are
# BYTE-IDENTICAL to a8d5d1a, so the install definition does not mention klass_refresh at
# all; an operator following only the artifact gets the inert outcome. Hand-carried onto
# the page from #1368 at ops-dev's explicit request, and marked as hand-carried. Second
# time a release's essential step has lived only in a bus message — atlas should put it in
# operational:.
#
# ⚠️ THE PAGE MUST NOT ASSERT #394's EFFECT, and does not. 89a774e is titled for the six
# two-digit codes claiming to be fylker and is in this range, but after install +
# klass_refresh + transform those six still violate with exactly 3648 rows (21 22 23 25 26
# 88), and a re-ingest cannot help: raw.ssb_klass_fylker carries 01..20, 30..56, 99 and
# none of the six. Not a claim the commit is broken — a claim its stated effect is not
# visible where it was looked for.
#
# ⚠️ 9999 "Uoppgitt" is an ACTIVE kommune, so any "active kommuner" denominator is 358
# while Norway has 357. Reported as introduced by the re-ingest; it was NOT — 22:25Z before
# the rebuild already showed 358 active on 1158 codes, and 00:30Z showed 358 on 1170, so
# the twelve new codes arrived inactive and 9999 was active beforehand. A pre-existing
# defect found while verifying a release is not a defect in it, and that distinction is
# the difference between pinning and holding. It cannot reach the numbers above:
# indicator_summary filters `not f.kommune_is_sentinel` on both counts. With atlas.
#
# ⚠️ ONE GAP LEFT: ssb-12063 is now the only series at kommuner_with_value = 0, down
# from 8. SSB holds 1812 values across 2015-2018 that never reached the fact table. #1351.
#
# ⚠️ A PIN DOES NOT LAND THE DATA. Image read off the RUN POD; transform aa5188d3
# SUCCESS 361.8s; checks 990/18/1008. Pin and run are two actions and this catalogue
# performs only the first.
#
# Procedural lessons from the previous bump (tags/list truncation, and a stale working
# tree nearly reverting PR #86) now live in RUNBOOK-application-pin-bump.md, under
# "Two ways this check has been wrong" — not here, because this block is rewritten
# every bump and a lesson stored in it is a lesson scheduled for deletion.
