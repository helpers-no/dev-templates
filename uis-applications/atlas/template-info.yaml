# Where the install definition actually lives.
#
# The digest is authored and committed, never resolved at build time: a tag is
# mutable at a registry, so a build that re-resolved it would let a re-pointed tag
# be blessed by the next unrelated docs build. Bumping atlas is a reviewed change
# to `digest` here.
#
# Verified before pinning by `scripts/verify-application-pin.sh` (urb-agents #795):
#   release asset and GHCR docker-content-digest agree on the ARTIFACT digest
#   blob pulled AT that digest hashes to the manifest
#   declares kind: application, id: atlas, tag: v20260913-7deb4a2
#
# 🔴 TWO DIGESTS. Below is the ARTIFACT digest. The definition also declares
# sha256:6684ff0c… — the code-location IMAGE digest — which must NOT be pinned here.
#
# 🔴 THE REGISTER PUBLISH: api_v1.brreg_enhet, ~1.17M organisations including
# ~462,000 sole proprietors who are natural persons. Largest public surface Atlas
# has added, on Terje's instruction.
#
# Stage 3 of the four-stage flow. imac's verdict was read directly on #794 —
# "Advance to stage 3." — rather than taken from the relay, because this repo is
# instructed to refuse a stage-3 ring without it. Three builds died at stage 2
# before this one (2616c9c, 576f2be, cfd2ca7).
#
# ⚠️ imac hashed the trees inside the cfd2ca7 and 7deb4a2 images and found them
# IDENTICAL (e07a4e04…) while the image digests differ. Two artifacts can carry
# byte-identical code under different image digests, so a changed code-location
# digest is not by itself evidence of a code change.
source:
  artifact: ghcr.io/terchris/atlas-data/uis
  tag: v20260913-7deb4a2
  digest: "sha256:d2af25f28d0f77c63f820d98cc7c95301f8a0368d2d0c894d27ae704424f645f"

# Top-level, NOT inside source: that is where UIS reads it from.
visibility: public

configure_command: "uis template install atlas"

prerequisites:
  - text: "UIS provision-host container running"
    url: "https://uis.sovereignsky.no"
  - text: "Local Kubernetes cluster running (Rancher Desktop)"
    url: "https://www.rancher.com/products/rancher-desktop"
