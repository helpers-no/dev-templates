  # Checked by hand (HTTP 200) -- no pipeline stage validates an external link.
  - url: https://github.com/terchris/atlas/blob/main/website/docs/contributors/installing-on-uis.md
    title: Installing on UIS
    icon: github

# Where the install definition actually lives.
#
# The digest is authored and committed, never resolved at build time: a tag is
# mutable at a registry, so a build that re-resolved it would let a re-pointed tag
# be blessed by the next unrelated docs build. Bumping atlas is a reviewed change
# to `digest` here.
#
# Verified before pinning by `scripts/verify-application-pin.sh` (urb-agents #813):
#   release asset and GHCR docker-content-digest agree on the ARTIFACT digest
#   blob pulled AT that digest hashes to the manifest
#   declares kind: application, id: atlas, tag: v20260913-eba547e
#   operational.* enumerated with a parser, not inferred from a diff
#
# 🔴 THREE DIGESTS ARE IN PLAY ON THIS BUMP. Below is the ARTIFACT digest — the only
# one that belongs here. The other two are:
#   sha256:8191aacd…  the code-location IMAGE digest, inside the definition
#   sha256:519feb0f…  UIS 1.6.69 itself, which is a version gate and not a pin at all
# All three are sha256 + 64 hex. Pinning the wrong one passes every other check.
#
# Released from a PIN-HOLD whose clearing condition was exactly this: UIS >= 1.6.69,
# reported as a digest rather than a merge. On 1.6.68 `_warn_unrendered_operational`
# prints `install.first_load` on this artifact — a correct artifact on an old renderer,
# not a defect. So the install-time pass condition belongs to the tester, not here.
#
# ⚠️ Text-only relative to v20260913-7deb4a2. Its code-location image digest differs
# (6684ff0c -> 8191aacd) and that is NOT evidence the tree changed — the check is
# hashing the trees inside the images. Every value this repo's prose mirrors —
# first_data.{jobs,how}, automation, cadence, manual_only, unscheduled,
# external_services — compared equal between the two artifacts with a YAML parser,
# so nothing was re-derived.
source:
  artifact: ghcr.io/terchris/atlas-data/uis
  tag: v20260913-eba547e
  digest: "sha256:2d837e2ce9b2dfef26eb8ecfc72a32430b055617cf8cf74ef39a4d056bca6a1f"

# Top-level, NOT inside source: that is where UIS reads it from.
visibility: public

configure_command: "uis template install atlas"

prerequisites:
  - text: "UIS provision-host container running"
    url: "https://uis.sovereignsky.no"
  - text: "Local Kubernetes cluster running (Rancher Desktop)"
    url: "https://www.rancher.com/products/rancher-desktop"
