# Where the install definition actually lives.
#
# The digest is authored and committed, never resolved at build time: a tag is
# mutable at a registry, so a build that re-resolved it would let a re-pointed tag
# be blessed by the next unrelated docs build. Bumping atlas is a reviewed change
# to `digest` here.
#
# Verified before pinning by `scripts/verify-application-pin.sh` (urb-agents #944):
#   release asset `artifact_digest` and GHCR docker-content-digest agree
#   asset's `image_digest` distinguished and asserted NOT to be this value
#   blob pulled AT the digest hashes to the manifest
#   declares kind: application, id: atlas, tag: v20260914-72999a4
#   operational.* enumerated with a parser: 17 paths, none added or removed vs e0ef430,
#   so the >= 1.6.69 pass condition is unaffected
#
# 🔴 TWO DIGESTS. Below is the ARTIFACT digest. The code-location IMAGE digest is
# sha256:f98df123… and must NOT be pinned here. The nomination labelled each to its image
# this time — the format atlas fixed at source after ce6d776b cost a refused pin.
#
# 🔴 THIS IS THE FIRST ATLAS UPGRADE THAT REQUIRES OPERATOR ACTION, and it requires TWO
# operations, not one:
#   1. dbt build --full-refresh --select +dim_brreg_enhet   as the atlas DB user, not a
#      superuser (a refresh drops and recreates; a superuser leaves the next run with
#      "permission denied"). Measured 256 s once, by imac, three runs.
#   2. a PUBLISH — materialise the api_v1 asset — because this release changes COMMENTs
#      and comments live in the DATABASE, not the image. A refresh is not a publish.
# Both are on the catalogue page under "Upgrading an existing install", which existed
# before this nomination precisely so it would not be written in a hurry (#849, 10361ea).
#
# Ongoing cost, stated by atlas as a miss rather than dressed as a pass: the half-hourly
# transform goes ~107.6 s -> ~139 s, ~1.6x at the model, against a ~97 s target atlas set
# itself. ~6.7 min/day, accepted against a bootstrap that otherwise reported success and
# wrote zero rows.
source:
  artifact: ghcr.io/terchris/atlas-data/uis
  tag: v20260914-72999a4
  digest: "sha256:90c9afb97f649c9930410943ed3c16abdbde52b5e315ed430d5f2b9d4c60c598"

# Top-level, NOT inside source: that is where UIS reads it from.
visibility: public

configure_command: "uis template install atlas"

prerequisites:
  - text: "UIS provision-host container running"
    url: "https://uis.sovereignsky.no"
  - text: "Local Kubernetes cluster running (Rancher Desktop)"
    url: "https://www.rancher.com/products/rancher-desktop"
