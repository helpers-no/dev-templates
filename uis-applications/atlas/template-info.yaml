# Where the install definition actually lives.
#
# The digest is authored and committed, never resolved at build time: a tag is
# mutable at a registry, so a build that re-resolved it would let a re-pointed tag
# be blessed by the next unrelated docs build. Bumping atlas is a reviewed change
# to `digest` here.
#
# Verified before pinning by `scripts/verify-application-pin.sh` (urb-agents #1148):
#   asset artifact_digest and GHCR docker-content-digest agree; image_digest
#   (sha256:4f8072bf…) distinguished and asserted NOT to be this value
#   blob hashes to the manifest; 36575 bytes via the raw-UTF-8 path
#   bad control in the same session: v20260916-nosuchtag -> 404
#
# 🟢 VALIDATED END TO END BY imac BEFORE nomination, which is what the PIN-HOLD this pin
# released required in those words. Installed as an UPGRADE over a loaded b7e513f install
# rather than a cold one: check exit 0, 14/14 public endpoints 200, automation 5 RUNNING,
# register current with 0 pending.
#
# 🔴 THE INTERIM BOX IS RETIRED BY THIS PIN, and only by this one. atlas PR #309 is in
# e439668, and imac verified its BEHAVIOUR in both cases — all five instigators stopped,
# and the PARTIAL case where one is stopped and four run, which is the case that had no
# fix at all before and that a whole-fleet check would miss.
#
# ⚠️ TWO THINGS LOOK BROKEN AFTER UPGRADING AND ARE NOT. Both on the page, both measured
# by intervention rather than inferred:
#   1. api_v1 checks 2 pass / 2 fail until `uis dagster run publish_api_v1` (~67 s) -> 4/4.
#      COMMENTs live in the database, so served docs track the last build that PUBLISHED.
#   2. `uis template check atlas` returns exit 2 "NOTHING WAS CHECKED" until one transform
#      has run, because marts.mart_source_freshness does not exist yet. After one
#      transform_and_publish (~376 s) it is exit 0. That is exit 2 in exactly the window
#      where an operator is checking whether the upgrade worked.
#
# 🔴 atlas PR #314 is NOT DELIVERED, and this repository is now the only surface carrying
# its sentence. Confirmed here by parsing the pinned artifact rather than on report:
# operational.first_data.how is 2300 characters, UIS renders ~1114, and "WHEN THESE SIX
# HAVE FINISHED THE INSTALL IS LOADED BUT NOT VALIDATED" starts at character 1159 — 45
# past the cut. It appears in no install output, no --dry-run, no progress, no check. The
# page says it in its own words and says to retire that box when UIS renders the whole
# field, NOT when the artifact next changes, because the artifact already says it.
#
# ⚠️ Not fully verified, per imac and worth not recording as done: #314's positive case
# cannot be demonstrated on that machine (all 685 checks have now run there, so a correct
# implementation stays silent) — a genuinely fresh install is still owed; #317 was a
# threshold-scaled reproduction, disclosed unasked, tested both directions; and
# transform_checks still cannot be launched on demand, which is platform-side.
#
# 🔵 A transform_checks SUCCESS can carry 18 failed checks. Diffed against the overnight
# b7e513f run in the same database: 0 new, 0 fixed, pre-existing kommune_nr / fylke_nr
# referential integrity. Do not read the exit code as the check count.
