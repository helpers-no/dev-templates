# Where the install definition actually lives.
#
# The digest is authored and committed, never resolved at build time: a tag is
# mutable at a registry, so a build that re-resolved it would let a re-pointed tag
# be blessed by the next unrelated docs build. Bumping atlas is a reviewed change
# to `digest` here.
#
# Verified before pinning by `scripts/verify-application-pin.sh` (urb-agents #1382):
#   asset artifact_digest and GHCR docker-content-digest agree; image_digest
#   (sha256:d66a23e8…) distinguished and asserted NOT to be this value
#   blob hashes to the manifest; kind/id/tag self-consistent
#
# 🔴 THE DELIVERABLE IS THE MOST CONSEQUENTIAL THING PINNED SO FAR, and it is not about
# this catalogue. FHI SUPPRESSES small counts — a cell under ~6 cases, and the WHOLE SERIES
# past 20% suppressed, explicitly so a partial series cannot skew the impression of a kommune.
# A consumer reading that gap as "no need here" produces exactly that skew, in the direction
# that moves help AWAY FROM THE SMALLEST PLACES. Now stated in both surfaces a need index
# meets: kommuner_with_null.description 145 -> 1788 chars (SUPPRESSION present) and
# indicator_missing_kommuner.description 714 -> 1357 (LOW NEED present).
#   ⚠️ WITH THE LIMIT: SSB does NOT suppress, it ZERO-FILLS. Same column, two publishers,
#   opposite conventions, neither reading transfers. /meta_sources names the publisher.
#
# ✅ ONE PUBLISH COVERED TWO RELEASES — d077fd7 and 3072f1f, which had never been deployed.
# So BOTH defects this entry reported in operational.upgrade (#1377) are already fixed here:
# the dangling `operational.crons` pointer now reads `operational.cadence` BELOW, and
# transform_checks is declared under a new operational.sensor_triggered with after: and why:
# instead of living only in prose. Verified by parsing this artifact — no crons key exists and
# the string appears nowhere in it.
#
# 🔴 RETRACTED FROM THE PAGE: the "49-88 s historical band" for publish_api_v1. It was
# inherited through nominations and NOBODY RECORDED WHICH CLOCK IT MEASURED. Tool and
# run-storage clocks disagree 20-40% on the same run — 6cb28f4 was 72.9 s tool / 103.8 s
# storage, d077fd7 was 107.4 s / 150.3 s — so the band could be chosen but not checked, and
# under the storage reading this entry called an over-band run "inside". ops-dev retired the
# number rather than defend it and asked that this page drop it. No band replaces it, and
# every per-job duration here is now labelled an order of magnitude, not a tripwire.
# A DURATION WITH NO NAMED CLOCK IS THE SAME CLASS OF CLAIM AS A MEASUREMENT WITH NO NAMED
# BUILD, and this entry has now shipped one of each.
#
# ⚠️ The operator's hypothesis for 107.4 s — two releases' worth of COMMENT statements,
# +2286 chars against 6cb28f4's +772 — is carried as a HYPOTHESIS and is unmeasured. What
# settles "did something else run" is the byte-for-byte 222-series diff, not the clock.
#
# ⚠️ UNCHANGED, none of it this release's doing: ssb-12063 remains the one zero-coverage
# series, current-year-only by ingest; #394 remains a filing whose title reads as a fix; 9999
# "Uoppgitt" has is_active correct with is_sentinel carrying the meaning. On the page.
#
# ⚠️ A PIN DOES NOT LAND THE DATA — this one needed no transform and no checks, and 0
# model .sql files are in the range. Pin and run are two actions and this catalogue performs
# only the first.
#
# NOMINATED urb-agents #1828 (atlas), BUMPED ops-dev 2026-10-03 — the fourth pin today, each
# one routine (single release, no catch-up).
#
# Verified three ways, not copied from the nomination: `verify-application-pin.sh --app
# atlas --tag v20261003-0ffeb79 --expect-digest sha256:fe8ab71e...` PASSed — release asset,
# GHCR docker-content-digest, and the decoded artifact's own tag/id/kind all agree.
#
# WHAT MOVED, re-derived from `operational:`, not just copied from the nomination's headline:
# data.sources 53->54, public_relations 90->91 (raw/marts/views: 62/92/78 -> 63/93/79), a
# third new Utdanningsdirektoratet source (udir-fravar, PLAN-017) taking that publisher from
# 3 to 4 — now ahead of Brønnøysundregistrene in the publisher list. Licence line now "NLOD
# for 50 of 54" — same four CC BY 4.0 exceptions, denominator only. first_data.jobs, cadence,
# external_services, unscheduled and operational.upgrade all checked directly against the
# artifact and confirmed UNCHANGED.
#
# ⚠️ Still open, unchanged this release: operational.automation still reads "ships stopped" —
# see urb-agents #1814 for the live question, raised with atlas. Not re-litigated each bump.
#
# Procedural lessons from an earlier bump (tags/list truncation, and a stale working
# tree nearly reverting PR #86) now live in RUNBOOK-application-pin-bump.md, under
# "Two ways this check has been wrong" — not here, because this block is rewritten
# every bump and a lesson stored in it is a lesson scheduled for deletion.
