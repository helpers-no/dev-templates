# Where the install definition actually lives.
#
# The digest is authored and committed, never resolved at build time: a tag is
# mutable at a registry, so a build that re-resolved it would let a re-pointed tag
# be blessed by the next unrelated docs build. Bumping atlas is a reviewed change
# to `digest` here.
#
# Verified before pinning by `scripts/verify-application-pin.sh` (urb-agents #993):
#   asset artifact_digest and GHCR docker-content-digest agree; image_digest
#   (sha256:2e52e074…) distinguished and asserted NOT to be this value
#   blob hashes to the manifest; 31611 bytes via the raw-UTF-8 path
#
# 🔴 SUPERSEDES v20260914-1fa7961, which this repository advertised for about an hour and
# which cries wolf: its check counted PENDING deletions without asking whether they had
# been APPLIED, so a healthy system reported UNHEALTHY for ~11 minutes in every 30 and
# rendered identically to the real incident the check exists to catch. The fix asks the
# deletion's own oppdateringsid against the dimension watermark — no clock, so it cannot
# drift when the :10/:40 offset is tuned.
#
# Verified BOTH directions on a real cluster by imac, one commit apart on identical rows:
#   1fa7961  pending 47, applied 25191244, deletion still served -> exit 1
#   15dc497  the same rows                                       -> exit 0
# and the RED case was CONSTRUCTED, not reasoned about: an already-applied deletion's
# organisation was re-inserted into marts.dim_brreg_enhet so the API served it while its
# deletion was applied -> UNHEALTHY at ZERO age. It reported both conditions at once,
# labelled differently. The alarm was not silenced, it was made specific. Fixture reverted
# and the revert verified.
#
# Declaration identity, stated precisely per this repo's correction on pin A: NOT
# byte-identical — the two publish-time substitutions differ (code_location.tag and
# .digest). All EIGHT code_location keys are identical and env_from_services is unchanged
# at {ATLAS_POSTGREST_URL: postgrest}. Key list from the PULLED artifact, not a source
# diff.
#
# ✅ Installed through the SUPPORTED surface with no fabricated step, using UIS 1.6.88's
# new --version flag:
#   ./uis template install atlas --version v20260914-15dc497@sha256:058e7bba…   exit 0
# That closes the circular dependency this repo flagged on #980 — a nominee could not
# reach the supported surface until it was already pinned, and the catalogue was the
# circle.
#
# UIS floor unchanged at 1.6.84+. --full-refresh from 72999a4 unchanged. No models, no
# migrations, no schema keys.
#
# ⚠️ NOT VERIFIED: an applied deletion served for HOURS (zero age was produced; the claim
# is any age), and the pending/applied split under a bulk reload where the watermark jumps.
# Scope: one cluster.
source:
  artifact: ghcr.io/terchris/atlas-data/uis
  tag: v20260914-15dc497
  digest: "sha256:058e7bba6257d388acdbf308544fd0f098119b47361d35f6e374296a1428fd9f"

# Top-level, NOT inside source: that is where UIS reads it from.
visibility: public

configure_command: "uis template install atlas"

prerequisites:
