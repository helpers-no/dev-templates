# Where the install definition actually lives.
#
# The digest is authored and committed, never resolved at build time: a tag is
# mutable at a registry, so a build that re-resolved it would let a re-pointed tag
# be blessed by the next unrelated docs build. Bumping atlas is a reviewed change
# to `digest` here.
#
# Verified before pinning by `scripts/verify-application-pin.sh` (urb-agents #1323):
#   asset artifact_digest and GHCR docker-content-digest agree; image_digest
#   (sha256:9014518d…) distinguished and asserted NOT to be this value
#   blob hashes to the manifest; kind/id/tag self-consistent
#
# 🔴 THIS PIN EXPOSED A DEFECT IN THIS REPO'S OWN DRIFT CHECK. ghcr's tags/list
# SILENTLY TRUNCATES: with no ?n it returned exactly 100 tags for a repository holding
# 118, and the 18 it dropped included this very tag. --drift therefore computed "newest
# published artifact" from a subset and named v20260921-de9d4ae. With ?n=1000 it names
# 2d88589, which is correct. A truncated list is indistinguishable from a complete one —
# the same failure family as a mislabelled mediaType and a case-sensitive grep returning
# zero. Fixed, and it now fails loudly if it hits the ceiling.
#
# ⚠️ ALSO: this session's working tree was ONE COMMIT BEHIND origin/main. The catalogue
# had been pinned to v20260919-6e10058 by PR #86 while this agent was stopped. Editing
# from the stale tree and pushing would have silently reverted that pin. `git fetch`
# before trusting a local entry after any gap.
#
# NEW: a `data:` block — 44 sources, 5 publishers, 19 public relations, NLOD for 42 of 44.
# The counts are generated with a CI check that fails on drift, so they cannot rot against
# the repo. The page carries them AND says the live endpoints are the authority.
#
# ⚠️ At pin time public_relations said 19 and the live API served 16 — three relations
# 404ing during an unrelated transform_and_publish, not caused by this tag. Recorded on
# the page as "ask the endpoints", which is what the block's own discover: line says.
#
# ⚠️ A PIN DOES NOT LAND THE DATA. The image carries the new FHI models; their rows arrive
# on a separate transform_and_publish. Pin and run are two actions and this is the first.
source:
  artifact: ghcr.io/terchris/atlas-data/uis
  tag: v20260921-2d88589
  digest: "sha256:35972b5264e08e736b5532452e46cb3054e04adb5052d31ac85b379ed7270368"

# Top-level, NOT inside source: that is where UIS reads it from.
visibility: public

configure_command: "uis template install atlas"

prerequisites:
  - text: "UIS provision-host container running"
    url: "https://uis.sovereignsky.no"
  - text: "Local Kubernetes cluster running (Rancher Desktop)"
    url: "https://www.rancher.com/products/rancher-desktop"
