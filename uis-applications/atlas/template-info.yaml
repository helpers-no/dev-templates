# template-info.yaml — atlas application catalogue entry
#
# This is the CATALOGUE POINTER, not the install definition. The definition is the
# OCI artifact named in `source:` below, published by atlas beside its own image.
# `params:` and `provides:` deliberately do not appear here — they come from the
# artifact's own template-info.yaml. See ../README.md.

id: atlas
version: "v20260910-d7fa93c"
name: Atlas Data
description: >-
  Norway's civil-society sector as a REST API — municipality-level indicators of
  humanitarian need, and the NGOs and local chapters that respond to them.
category: APPLICATION
install_type: application
# Authored by atlas (urb-agents #489), not by this repository. Replace only on
# atlas's word.
abstract: |-
  Installs the Atlas data platform as one application: a PostgreSQL database with
  its migrations, a Dagster code location running the ingest and dbt transforms,
  and a PostgREST API over the curated api_v1 views.

  The data is an open semantic layer over Norwegian public sources — SSB
  statistics, FHI public-health and living-conditions indicators, Bufdir child-poverty
  figures and the Brønnøysund business register — joined to NGO supply data, so
  that humanitarian need and the organisations responding to it can be queried
  together at kommune level.

  The API is self-describing: meta_sources, meta_endpoints and meta_dimensions let
  a consumer discover what is available without out-of-band documentation.

  A fresh install serves an empty API until the first pipeline run — the schema and
  grants exist from install, the data arrives on the ingest schedule. Exports
  api-url for other applications to consume.

  Installing does not start anything: the schedules ship stopped, so no data is
  fetched until an operator turns them on. That is a deliberate go-live decision,
  not a side effect of installing.
tools: ""
readme: README-atlas.md
tags:
  - atlas
  - ngo
  - data
  - postgresql
  - dagster
  - postgrest
  - api
logo: atlas-logo.svg
maintainers:
  - terchris
links:
  - url: https://github.com/terchris/atlas
    title: Source code
    icon: github

# Where the install definition actually lives.
#
# The digest is authored and committed, never resolved at build time: a tag is
# mutable at a registry, so a build that re-resolved it would let a re-pointed tag
# be blessed by the next unrelated docs build. Bumping atlas is a reviewed change
# to `digest` here.
#
# Verified before pinning, three independent sources in agreement (urb-agents #514):
#   atlas's own message      sha256:c1fb585b…ee19b
#   release asset            .../releases/download/v20260910-d7fa93c/uis-artifact.json
#   GHCR docker-content-digest for the tag
# The artifact's template-info.yaml was pulled from the registry at this digest and
# decoded: `kind: application`, `id: atlas` (so UIS's identity check has something to
# bite on), and its own `tag:` equals this pin.
#
# ⚠️ Do NOT pin v20260910-4e9f13c or v20260910-6429719. Their first_data names three
# jobs and omits brreg-enheter, so a user following the artifact ends with that source
# empty and the freshness test red (imac, #507).
source:
  artifact: ghcr.io/terchris/atlas-data/uis
  tag: v20260910-d7fa93c
  digest: "sha256:c1fb585bc9bb9fc46c92f724142c70d62a38f33102d75c40c1e1feb4a10ee19b"

# Top-level, NOT inside source: that is where UIS reads it from.
visibility: public

configure_command: "uis template install atlas"

prerequisites:
  - text: "UIS provision-host container running"
    url: "https://uis.sovereignsky.no"
  - text: "Local Kubernetes cluster running (Rancher Desktop)"
    url: "https://www.rancher.com/products/rancher-desktop"
