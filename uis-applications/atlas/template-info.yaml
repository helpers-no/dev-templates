# Where the install definition actually lives.
#
# The digest is authored and committed, never resolved at build time: a tag is
# mutable at a registry, so a build that re-resolved it would let a re-pointed tag
# be blessed by the next unrelated docs build. Bumping atlas is a reviewed change
# to `digest` here.
#
# Verified before pinning by `scripts/verify-application-pin.sh` (urb-agents #1377):
#   asset artifact_digest and GHCR docker-content-digest agree; image_digest
#   (sha256:7982dff0…) distinguished and asserted NOT to be this value
#   blob hashes to the manifest; kind/id/tag self-consistent
#
# ✅ THE HAND-CARRY ENDS HERE. operational.upgrade is ADDED in this build — the only
# difference in either block against ff164d5 — so the klass sequence README-atlas.md has
# carried by hand for three pins is now DERIVED from the artifact and marked with this pin.
# The condition this entry wrote ("when a build WITH the field is pinned") is met, which is
# the first time one of these conditions has been cleared by the thing happening rather
# than by the condition being rewritten.
#
# 🔵 What was added is a RULE, not another job list: default for an upgrade is
# transform_and_publish alone; the exception is a release that changes WHAT AN INGEST
# FETCHES (window, filters, dimensions), because the transform cannot recover rows that
# were never requested. Plus a self_healing_warning that an unrun ingest change is repaired
# by its next cron — up to a month for klass_refresh — with the cause never recorded.
#
# ⚠️ TWO POINTERS IN THAT FIELD DO NOT RESOLVE, verified by walking the parsed artifact:
# it says "operational.crons above maps every job" and there is NO crons key (the map is
# operational.cadence), and it ends the sequence with transform_checks, which appears in no
# map at all — not cadence, not manual_only, not unscheduled. Neither changes what an
# operator should do; both would send a reader looking for something absent. Reported #1377.
#
# ✅ WHAT THE RELEASE DELIVERS lives entirely in the DATABASE: the brreg_enhet field docs
# grew 958 -> 1730 chars with the count=exact latency warning (12-33 s filtered against
# sub-second; inside a browser fetch that is a TIMEOUT, not a slow answer; count=planned is
# 50x faster and was 6x wrong, 118 against an actual 716). So this pin needed publish_api_v1
# (72.9 s, inside its 49-88 s band) and NO transform and NO checks — the cheap upgrade path
# this entry has described since fcf78e6, as the whole of a release for once.
#
# 🔴 AND THE RANGE, NOT THE HEAD COMMIT, IS THE TEST. ops-dev called this release
# artifact-only from the head commit's file list; 7fe3a0d inside the range adds 15 COMMENT ON
# lines, which live in the database and which only publish_api_v1 applies. atlas's rule is
# that a release touching only uis/ and template-info.yaml needs no job — but the test is
# the RANGE. This entry has previously accepted "website-only" and "docs-only" descriptions
# of ranges it did not inspect (275eb4f, 50c9700, #1367).
#
# ⚠️ UNCHANGED, none of it this release's doing: ssb-12063 is still the only series at
# kommuner_with_value = 0 and is current-year-only by ingest (Tid: TOP(1)); #394 remains a
# filing whose title reads as a fix; 9999 "Uoppgitt" has is_active correct with is_sentinel
# carrying the meaning. All on the page as caveats.
#
# ⚠️ A PIN DOES NOT LAND THE DATA — though this one needed no transform. Pin and run are
# two actions and this catalogue performs only the first.
#
# Procedural lessons from the previous bump (tags/list truncation, and a stale working
# tree nearly reverting PR #86) now live in RUNBOOK-application-pin-bump.md, under
# "Two ways this check has been wrong" — not here, because this block is rewritten
# every bump and a lesson stored in it is a lesson scheduled for deletion.
