# Where the install definition actually lives.
#
# The digest is authored and committed, never resolved at build time: a tag is
# mutable at a registry, so a build that re-resolved it would let a re-pointed tag
# be blessed by the next unrelated docs build. Bumping atlas is a reviewed change
# to `digest` here.
#
# Verified before pinning by `scripts/verify-application-pin.sh` (urb-agents #970):
#   asset artifact_digest and GHCR docker-content-digest agree; image_digest
#   (sha256:69e0de8a…) distinguished and asserted NOT to be this value
#   blob hashes to the manifest; kind/id/tag self-consistent; 30707 bytes read via the
#   raw-UTF-8 path, because the layer still declares .tar and is not one
#
# 🔴 A BETTER ERROR MESSAGE, NOT A FIX. The declaration is unchanged, so nothing about
# the defect changes: env_from_exports is still declared, api-url is still host-facing
# loopback, and the address delivered into the pod is still wrong. The real remedy is
# env_from_services (UIS 1.6.84); no atlas artifact uses it yet. A pin landing on the day
# of a long argument reads as the argument landing — it did not.
#
# ⚠️ PRECISION ON THE "BYTE-IDENTICAL" PREMISE, which is the nomination's one inference:
# the published template-info.yaml files are NOT byte-identical. They differ in exactly
# four lines — code_location.tag and code_location.digest, both substituted at publish:
#     tag     v20260914-123cdc8  ->  v20260914-9509ea5
#     digest  sha256:6dd4056b…   ->  sha256:69e0de8a…
# What IS identical is the authored source and, decisively, all EIGHT code_location keys:
#   digest env_from_exports env_secrets image module name tag why
# tor-agent's 1.6.84 result was a key-whitelist and validator pass, so it transfers on key
# identity — which holds. The conclusion stands; the premise as stated was stronger than
# the evidence, and "byte-identical" would license a wrong inference if a third field ever
# moved. Verified here with shasum, cmp and a key enumeration.
#
# ⚠️ NOT INSTALLED BY ANYONE. imac confirmed the digests; the quoted diagnostic is atlas
# driving its own code on its own machine. Accepted for a message-only change with an
# unchanged declaration — and it would not be acceptable for anything touching models or
# the schema.
source:
  artifact: ghcr.io/terchris/atlas-data/uis
  tag: v20260914-9509ea5
  digest: "sha256:13f3925c665f8065fe6624ddc4d9b8a7c9d314df0e63082bdc59b485fe41d2d8"

# Top-level, NOT inside source: that is where UIS reads it from.
visibility: public

configure_command: "uis template install atlas"

