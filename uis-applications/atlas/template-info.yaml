# Where the install definition actually lives.
#
# The digest is authored and committed, never resolved at build time: a tag is
# mutable at a registry, so a build that re-resolved it would let a re-pointed tag
# be blessed by the next unrelated docs build. Bumping atlas is a reviewed change
# to `digest` here.
#
# Verified before pinning by `scripts/verify-application-pin.sh` (urb-agents #827):
#   release asset and GHCR docker-content-digest agree on the ARTIFACT digest
#   blob pulled AT that digest hashes to the manifest
#   declares kind: application, id: atlas, tag: v20260913-e0ef430
#   operational.* enumerated with a parser: 17 paths, none added or removed vs eba547e,
#   so the >= 1.6.69 pass condition is unaffected
#
# 🔴 THE NOMINATION GAVE THE WRONG DIGEST AND THE VERIFIER CAUGHT IT.
#   nominated to pin   sha256:ce6d776b…  <- this is the CODE-LOCATION IMAGE digest
#   actually pinned    sha256:a3beb267…  <- the ARTIFACT digest, from the release asset
#                                            and GHCR, which agree with each other
# The tag was right and stated three times; only the digest was the wrong one of the two
# the definition carries. Pinning ce6d776b would have passed every fetch-side check and
# surfaced on a cluster as an unexplained pull failure.
#
# Why THIS tag of three published within 17 minutes: it is the only one carrying both
# contract fixes. Verified by decoding all three rather than taking the claim —
#   d78141a  install.first_load 60 marts / first_data.takes 64   still contradicts
#   f21f099  install.first_load 60 marts / first_data.takes 64   still contradicts
#   e0ef430  both 61, with the BASE TABLE counting rule stated   <- complete
#
# ⚠️ NOT purely prose. chapter_data_shape is a dbt model description that PostgREST
# publishes as OpenAPI field docs, so the code-location image digest moving MEANS
# something here — unlike eba547e, where it moved and meant nothing.
source:
  artifact: ghcr.io/terchris/atlas-data/uis
  tag: v20260913-e0ef430
  digest: "sha256:a3beb26715b6e6508d9774a70341692cda66b80109c41d20931cc2d7f304dcba"

# Top-level, NOT inside source: that is where UIS reads it from.
visibility: public

configure_command: "uis template install atlas"

prerequisites:
  - text: "UIS provision-host container running"
    url: "https://uis.sovereignsky.no"
  - text: "Local Kubernetes cluster running (Rancher Desktop)"
    url: "https://www.rancher.com/products/rancher-desktop"
