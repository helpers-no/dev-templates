# template-info.yaml — atlas application catalogue entry
#
# This is the CATALOGUE POINTER, not the install definition. The definition is the
# OCI artifact named in `source:` below, published by atlas beside its own image.
# `params:` and `provides:` deliberately do not appear here — they come from the
# artifact's own template-info.yaml. See ../README.md.

id: atlas
version: "v20260914-9509ea5"
name: Atlas Data
description: >-
  Norway's civil-society sector as a REST API — municipality-level indicators of
  humanitarian need, and the NGOs and local chapters that respond to them.
category: APPLICATION
install_type: application
# Authored by atlas (urb-agents #489), not by this repository. Replace only on
# atlas's word.
abstract: |-
  Installs the Atlas data platform as one application: a PostgreSQL database with
  its migrations, a Dagster code location running the ingest and dbt transforms,
  and a PostgREST API over the curated api_v1 views.

  The data is an open semantic layer over Norwegian public sources — SSB
  statistics, FHI public-health and living-conditions indicators, Bufdir child-poverty
  figures and the Brønnøysund business register — joined to NGO supply data, so
  that humanitarian need and the organisations responding to it can be queried
  together at kommune level.

  The API is self-describing: meta_sources, meta_endpoints and meta_dimensions let
  a consumer discover what is available without out-of-band documentation.

  A fresh install serves an empty API until the first pipeline run — the schema and
  grants exist from install, the data arrives on the ingest schedule. Exports
  api-url for other applications to consume.

  Installing does not start anything: the schedules and sensors ship stopped, so
  no data is fetched until an operator turns them on. That is a deliberate go-live
  decision, not a side effect of installing — and enabling them starts the NEXT
  scheduled run rather than backfilling, so a fresh install stays empty until the
  first-data jobs are launched by hand.
tools: ""
readme: README-atlas.md
tags:
  - atlas
  - ngo
  - data
  - postgresql
  - dagster
  - postgrest
  - api
logo: atlas-logo.svg
maintainers:
