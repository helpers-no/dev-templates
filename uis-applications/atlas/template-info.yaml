# Where the install definition actually lives.
#
# The digest is authored and committed, never resolved at build time: a tag is
# mutable at a registry, so a build that re-resolved it would let a re-pointed tag
# be blessed by the next unrelated docs build. Bumping atlas is a reviewed change
# to `digest` here.
#
# Verified before pinning by `scripts/verify-application-pin.sh` (urb-agents #956):
#   asset artifact_digest and GHCR docker-content-digest agree; image_digest
#   (sha256:6dd4056b…) distinguished and asserted NOT to be this value
#   blob pulled AT the digest hashes to the manifest; kind/id/tag self-consistent
#
# ⚠️ THE template-info.yaml LAYER LIES ABOUT ITS OWN mediaType. It declares
# application/vnd.oci.image.layer.v1.tar and is RAW UTF-8 YAML — tarfile.open raises.
# A verifier that trusts the declared type reads NOTHING, and an empty read is
# indistinguishable from an absent field, which is usually the thing being checked. The
# verifier now names which path it used and refuses an empty read outright.
#
# Reproduced tor-agent's known-NEGATIVE control rather than only the positive:
#   123cdc8   env_from_exports 1   api-url 4
#   72999a4   env_from_exports 0   api-url 1   <- proves the read works on that blob,
#                                                 so the 0 is a real absence
#
# ⚠️ The --full-refresh requirement from v20260914-72999a4 is UNCHANGED and still applies.
# This delta is a declaration plus a render gate, not a schema change.
#
# 🔴 UIS >= 1.6.82 is a floor on the OUTCOME, not on the install: older UIS ignores
# env_from_exports rather than rejecting it, so pinning breaks nothing — but below 1.6.82
# a host gets no benefit and no signal. tor-agent's caveat, worth keeping: the tolerance is
# correct BY ACCIDENT. env_from_exports sits inside code_location, which UIS iterates by
# known keys rather than validates. One level up and this pin would have REJECTED the
# install on every host not on 1.6.82.
#
# ⚠️ NOT VERIFIED END TO END: nobody has seen ATLAS_POSTGREST_URL inside a running pod.
# The writer was verified standalone. Do not let this pin imply the wiring works.
source:
  artifact: ghcr.io/terchris/atlas-data/uis
  tag: v20260914-123cdc8
  digest: "sha256:ae08a38ee9f34f2a8689a5b99f50cbe8b8e4d69ea0a60a30838910bb7298a126"

# Top-level, NOT inside source: that is where UIS reads it from.
visibility: public

configure_command: "uis template install atlas"

prerequisites:
  - text: "UIS provision-host container running"
    url: "https://uis.sovereignsky.no"
  - text: "Local Kubernetes cluster running (Rancher Desktop)"
    url: "https://www.rancher.com/products/rancher-desktop"
