# Where the install definition actually lives.
#
# The digest is authored and committed, never resolved at build time: a tag is
# mutable at a registry, so a build that re-resolved it would let a re-pointed tag
# be blessed by the next unrelated docs build. Bumping atlas is a reviewed change
# to `digest` here.
#
# Verified before pinning by `scripts/verify-application-pin.sh` (urb-agents #773):
#   release asset and GHCR docker-content-digest agree on the ARTIFACT digest
#   blob pulled AT that digest hashes to the manifest
#   declares kind: application, id: atlas, tag: v20260912-5b46a8a
#   --drift named this tag independently, before the nomination was read
#
# 🔴 TWO DIGESTS. Below is the ARTIFACT digest. The definition also declares
# sha256:6e622784… — the code-location IMAGE digest — which must NOT be pinned here.
#
# Checked before pushing, because ops-dev asked for it by name (#773): the cadence
# block has SIX crons and Frivillighetsregisteret is still `0 4 * * *`, daily. It did
# NOT move to the feed's half-hourly cadence — it has no change feed, so every refresh
# is a ~727-request full re-walk, and half-hourly would be ~35,000 requests a day
# against a public-sector API.
source:
  artifact: ghcr.io/terchris/atlas-data/uis
  tag: v20260912-5b46a8a
  digest: "sha256:4893844e3b72950bf7c1fabf044f40fd111b01a8dae28bda61daf59169583daa"

# Top-level, NOT inside source: that is where UIS reads it from.
visibility: public

configure_command: "uis template install atlas"

prerequisites:
  - text: "UIS provision-host container running"
    url: "https://uis.sovereignsky.no"
  - text: "Local Kubernetes cluster running (Rancher Desktop)"
    url: "https://www.rancher.com/products/rancher-desktop"
